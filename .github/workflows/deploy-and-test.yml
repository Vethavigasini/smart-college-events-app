name: Deploy Web App & Run Selenium E2E Tests

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-and-test:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Checkout Repository
      - name: Step 1 - Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 20
      - name: Step 2 - Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Install Dependencies
      - name: Step 3 - Install Dependencies
        run: npm ci

      # Step 4: Export Expo Web Application
      - name: Step 4 - Export Expo Web Application
        run: |
          npx expo export --platform web
          echo "Expo Web build exported to dist/"

      # Step 5: Build QA Reports & Dashboards
      - name: Step 5 - Build QA Reports & Dashboards
        run: |
          npm run reports || true
          npm run selenium:reports || true
          npm run security:reports || true
          npm run load:reports || true
          npm run reports:master || true

      # Step 6: Assemble Combined GitHub Pages Site Payload
      - name: Step 6 - Assemble Combined GitHub Pages Payload
        run: |
          mkdir -p public_site/reports/latest
          RUN_ID="${{ github.run_number }}"
          HIST_DIR="public_site/reports/history/run-${RUN_ID}"
          mkdir -p "$HIST_DIR"

          # 1. Copy Expo Web app assets to root /
          cp -r dist/* public_site/
          
          # 2. Copy standalone web application pages
          cp index.html public_site/web-app.html || true

          # 3. Create 404.html fallback for GitHub Pages SPA routing
          cp dist/index.html public_site/404.html || true

          # 4. Create directory structure for physical web routes
          mkdir -p public_site/login public_site/register public_site/student/dashboard public_site/admin/dashboard
          cp dist/index.html public_site/login/index.html || true
          cp dist/index.html public_site/register/index.html || true
          cp dist/index.html public_site/student/dashboard/index.html || true
          cp dist/index.html public_site/admin/dashboard/index.html || true

          # 5. Touch .nojekyll to allow _expo static asset serving
          touch public_site/.nojekyll

          # 6. Copy QA reports into /reports/latest/
          cp -r "Test Results/HTML/"* public_site/reports/latest/ || true
          cp -r "Test Results/Summary/"* public_site/reports/latest/ || true
          cp -r "Test Results/JSON/"* public_site/reports/latest/ || true
          if [ -d "Test Results/Screenshots" ]; then
            cp -r "Test Results/Screenshots" public_site/reports/latest/ || true
          fi
          if [ -d "Test Results/Logs" ]; then
            cp -r "Test Results/Logs" public_site/reports/latest/ || true
          fi

          # 7. Archive copy into history
          cp -r public_site/reports/latest/* "$HIST_DIR/"

      # Step 7: Configure GitHub Pages
      - name: Step 7 - Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Step 8: Upload Pages Artifact
      - name: Step 8 - Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public_site'

      # Step 9: Deploy to GitHub Pages
      - name: Step 9 - Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Step 10: Verify Live Deployment HTTP 200 & Assets
      - name: Step 10 - Verify Live Deployment & Assets
        run: |
          LIVE_URL="https://Vethavigasini.github.io/smart-college-events-app/"
          echo "Verifying live URL HTTP status: $LIVE_URL"
          
          # Retry loop waiting for DNS / CDN propagation
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$LIVE_URL" || true)
            echo "Attempt $i: HTTP Status $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Live deployment returned HTTP 200 OK!"
              break
            fi
            sleep 5
          done

          # Asset HTTP 200 checks
          curl -I "$LIVE_URL"
          curl -s "$LIVE_URL" | grep -q "root\|app" && echo "✅ React/Expo root element verified."

      # Step 11: Execute Selenium Web E2E Tests against live BASE_URL
      - name: Step 11 - Execute Selenium Web E2E Suite
        env:
          BASE_URL: https://Vethavigasini.github.io/smart-college-events-app/
        run: |
          npm run selenium:test || true

      # Step 12: Compile Updated Selenium Execution Reports
      - name: Step 12 - Compile Updated Selenium Reports
        if: always()
        run: |
          npm run selenium:reports || true

      # Step 13: Upload Artifacts
      - name: Step 13 - Upload Selenium Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-execution-artifacts
          path: |
            automation/selenium/reports/
            automation/selenium/screenshots/
            automation/selenium/logs/
            Test Results/
          retention-days: 30

      # Step 14: Publish Step Summary
      - name: Step 14 - Publish Step Summary
        if: always()
        run: |
          echo "### 🌐 Live Deployment & Selenium E2E Web Execution" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Live Application Root**: [https://Vethavigasini.github.io/smart-college-events-app/](https://Vethavigasini.github.io/smart-college-events-app/)" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest Master QA Dashboard**: [https://Vethavigasini.github.io/smart-college-events-app/reports/latest/dashboard.html](https://Vethavigasini.github.io/smart-college-events-app/reports/latest/dashboard.html)" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Report**: [https://Vethavigasini.github.io/smart-college-events-app/reports/latest/execution-report.html](https://Vethavigasini.github.io/smart-college-events-app/reports/latest/execution-report.html)" >> $GITHUB_STEP_SUMMARY
