name: Publish QA Execution Reports to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish-reports:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Step 1: Checkout Repository
      - name: Step 1 - Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Setup Node.js 20
      - name: Step 2 - Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Install Dependencies
      - name: Step 3 - Install Dependencies
        run: npm ci

      # Step 4: Export Expo Web Application
      - name: Step 4 - Export Expo Web Application
        run: |
          npx expo export --platform web

      # Step 5: Generate Master Dashboards & QA Reports
      - name: Step 5 - Generate Master Dashboards & QA Reports
        run: |
          npm run reports || true
          npm run selenium:reports || true
          npm run security:reports || true
          npm run load:reports || true
          npm run reports:master || true

      # Step 6: Assemble Combined GitHub Pages Site Payload
      - name: Step 6 - Assemble Combined GitHub Pages Site Payload
        run: |
          mkdir -p public_site/reports/latest
          RUN_ID="${{ github.run_number }}"
          HIST_DIR="public_site/reports/history/run-${RUN_ID}"
          mkdir -p "$HIST_DIR"

          # 1. Copy Expo Web app assets to root /
          cp -r dist/* public_site/
          
          # 2. Touch .nojekyll to allow _expo static asset serving
          touch public_site/.nojekyll

          # 3. Copy QA reports into /reports/latest/
          cp -r "Test Results/HTML/"* public_site/reports/latest/ || true
          cp -r "Test Results/Summary/"* public_site/reports/latest/ || true
          cp -r "Test Results/JSON/"* public_site/reports/latest/ || true
          if [ -d "Test Results/Screenshots" ]; then
            cp -r "Test Results/Screenshots" public_site/reports/latest/ || true
          fi
          if [ -d "Test Results/Logs" ]; then
            cp -r "Test Results/Logs" public_site/reports/latest/ || true
          fi

          # 4. Archive copy into history
          cp -r public_site/reports/latest/* "$HIST_DIR/"

      # Step 7: Configure GitHub Pages
      - name: Step 7 - Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Step 8: Upload Pages Artifact
      - name: Step 8 - Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public_site'

      # Step 9: Deploy to GitHub Pages
      - name: Step 9 - Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Step 10: Upload Report Artifacts
      - name: Step 10 - Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-github-pages-reports
          path: public_site/
          retention-days: 30

      # Step 11: Publish GitHub Actions Step Summary
      - name: Step 11 - Publish Step Summary
        if: always()
        run: |
          echo "### 🌐 Published Live GitHub Pages Web App & QA Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Live Application Root**: [https://Vethavigasini.github.io/smart-college-events-app/](https://Vethavigasini.github.io/smart-college-events-app/)" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest Master Dashboard**: [https://Vethavigasini.github.io/smart-college-events-app/reports/latest/dashboard.html](https://Vethavigasini.github.io/smart-college-events-app/reports/latest/dashboard.html)" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Report**: [https://Vethavigasini.github.io/smart-college-events-app/reports/latest/execution-report.html](https://Vethavigasini.github.io/smart-college-events-app/reports/latest/execution-report.html)" >> $GITHUB_STEP_SUMMARY
