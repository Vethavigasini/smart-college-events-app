name: Publish QA Execution Reports to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  publish-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Step 1: Checkout Repository
      - name: Step 1 - Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Setup Node.js
      - name: Step 2 - Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Install Dependencies
      - name: Step 3 - Install Dependencies
        run: npm ci

      # Step 4: Generate All QA Reports
      - name: Step 4 - Generate Master Dashboards & QA Reports
        run: |
          npm run reports || true
          npm run selenium:reports || true
          npm run security:reports || true
          npm run load:reports || true
          npm run reports:master || true

      # Step 5: Prepare GitHub Pages Static Directory
      - name: Step 5 - Prepare Reports Pages Directory
        run: |
          # Create deployment workspace folder
          mkdir -p public_reports/reports/latest
          RUN_ID="${{ github.run_number }}"
          HIST_DIR="public_reports/reports/history/run-${RUN_ID}"
          mkdir -p "$HIST_DIR"

          # Copy files into reports/latest/
          cp -r "Test Results/HTML/"* public_reports/reports/latest/ || true
          cp -r "Test Results/Summary/"* public_reports/reports/latest/ || true
          cp -r "Test Results/JSON/"* public_reports/reports/latest/ || true
          
          if [ -d "Test Results/Screenshots" ]; then
            cp -r "Test Results/Screenshots" public_reports/reports/latest/ || true
          fi
          if [ -d "Test Results/Logs" ]; then
            cp -r "Test Results/Logs" public_reports/reports/latest/ || true
          fi

          # Archive copy into history
          cp -r public_reports/reports/latest/* "$HIST_DIR/"

      # Step 6: Deploy to GitHub Pages
      - name: Step 6 - Deploy to GitHub Pages gh-pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public_reports
          branch: gh-pages
          clean: false # Preserve previous history folder builds!

      # Step 7: Upload Report Artifacts
      - name: Step 7 - Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-github-pages-reports
          path: public_reports/
          retention-days: 30

      # Step 8: Publish GitHub Actions Step Summary
      - name: Step 8 - Publish GitHub Actions Step Summary
        if: always()
        run: |
          echo "### 🌐 Published Live GitHub Pages Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest Master Dashboard**: [https://Vethavigasini.github.io/smart-college-events-app/reports/latest/dashboard.html](https://Vethavigasini.github.io/smart-college-events-app/reports/latest/dashboard.html)" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Report**: [https://Vethavigasini.github.io/smart-college-events-app/reports/latest/execution-report.html](https://Vethavigasini.github.io/smart-college-events-app/reports/latest/execution-report.html)" >> $GITHUB_STEP_SUMMARY
          echo "- **Trends Dashboard**: [https://Vethavigasini.github.io/smart-college-events-app/reports/latest/trends.html](https://Vethavigasini.github.io/smart-college-events-app/reports/latest/trends.html)" >> $GITHUB_STEP_SUMMARY
          echo "- **Performance Dashboard**: [https://Vethavigasini.github.io/smart-college-events-app/reports/latest/performance-report.html](https://Vethavigasini.github.io/smart-college-events-app/reports/latest/performance-report.html)" >> $GITHUB_STEP_SUMMARY
          echo "- **Historical Run Archive**: \`https://Vethavigasini.github.io/smart-college-events-app/reports/history/run-${{ github.run_number }}/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
